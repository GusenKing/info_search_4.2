<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Поисковик</title>
    <style>
    body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #111827;
        padding: 50px;
    }

    ol {
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px
    }

    .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 32px 16px 48px;
    }

    h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 600;
        color: #1f2937;
    }

    h2 {
        margin-top: 32px;
        margin-bottom: 16px;
        font-size: 20px;
        font-weight: 500;
        color: #374151;
    }

    form {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        width: 50vw;
    }

    input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 999px;
        border: 1px solid #d1d5db;
        background-color: #ffffff;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button[type="submit"] {
        padding: 10px 40px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 10px 15px -10px rgba(37, 99, 235, 0.7);
        transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        white-space: nowrap;
    }

    button[type="submit"]:hover {
        background: linear-gradient(135deg, #1d4ed8, #1e40af);
        box-shadow: 0 14px 24px -12px rgba(37, 99, 235, 0.85);
        transform: translateY(-1px);
    }

    .results-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .result-item {
        background-color: #ffffff;
        border-radius: 10px;
        padding: 14px 16px;
        box-shadow: 0 6px 18px rgba(31, 41, 55, 0.08);
        border: 1px solid #e5e7eb;
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: flex-start;
        width: 60vw;
    }

    .no-results {
        margin-top: 8px;
        font-size: 14px;
        color: #6b7280;
    }
</style>
</head>
<body>
    <h1>Поисковик</h1>

    <form method="post">
        <input type="text" name="query" size="60"
               placeholder="Введите запрос"
               value="{{ query|e }}">
        <button type="submit">Искать</button>
    </form>

    {% if query %}
        <h2>Результаты для: "{{ query }}"</h2>
        {% if results %}
            <ol class="result-list">
                {% for doc, score in results %}
                    <li class="result-item">
                        <strong>{{ doc }}</strong>
                        — {{ "%.5f"|format(score) }}
                    </li>
                {% endfor %}
            </ol>
        {% else %}
            <p>Ничего не найдено</p>
        {% endif %}
    {% endif %}
</body>
</html>
